name: indian_business_utils
description: Utilities for Indian ERP and accounting apps including GST calculation, validators, invoice helpers and financial utilities.
version: 0.0.3
homepage: https://github.com/nisargratani/indian_business_utils
repository: https://github.com/nisargratani/indian_business_utils
issue_tracker: https://github.com/nisargratani/indian_business_utils/issues
topics:
  - gst
  - india
  - invoice
  - accounting
  - validation

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Wide range on purpose: Flutter's flutter_localizations pins an exact intl
  # version, so a narrow constraint makes this package uninstallable in
  # localized Flutter apps.
  intl: '>=0.18.0 <0.21.0'

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: ^1.24.0
